[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-browser"
version = "0.3.0"
description = "Signal Browser: encrypted local Signal archive, HTML export, and read-only Signal-like UI"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Leo A. Ramirez Jr.", email = "leo.ramirez@alumni.stanford.edu" }
]
keywords = [
  "signal", "signal-messages", "signal-desktop", "signal-backup", "signal-app",
  "export", "sqlite", "html", "attachments", "conversations", "chat-export",
  "messaging", "backup", "viewer", "responsive-ui"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
app = [
  "pywebview>=5",
  "keyring>=25",
]
pack = [
  "pyinstaller>=6",
]
dev = [
  "pytest>=7",
  "coverage>=7",
  "cryptography>=42",
]

[project.scripts]
signal-browser-html = "signal_browser.cli:main"
signal-browser = "signal_browser.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_browser = [
  "assets/*.html",
  "assets/*.css",
  "assets/*.js",
  "assets/*.svg",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
